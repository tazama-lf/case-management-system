services:
  migrate:
    build:
      context: ./backend
      target: migrate
    container_name: tazama-cms-migrate
    networks:
      - tazama_default
    env_file:
      - ./backend/.env
    command: sh /home/app/migrate.sh

  couchdb:
    image: couchdb:3.3
    container_name: tazama-cms-couchdb
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - '5984:5984'
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./docker/couchdb/local.ini:/opt/couchdb/etc/local.d/local.ini
    networks:
      - tazama_default

  flowable:
    image: flowable/flowable-rest:latest
    container_name: tazama-cms-flowable
    restart: unless-stopped
    depends_on:
      - migrate
    env_file:
      - ./backend/.env
    ports:
      - '8081:8080'
    networks:
      - tazama_default

  backend:
    build:
      context: ./backend
      target: run-env
    container_name: tazama-cms-backend
    restart: unless-stopped
    depends_on:
      - migrate
      - flowable
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/public.pem:/home/app/public.pem:ro
    ports:
      - '3090:3090'
    networks:
      - tazama_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tazama-cms-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    networks:
      - tazama_default

  voila:
    build:
      context: .
      dockerfile: Dockerfile.voila
    container_name: tazama-cms-voila
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - '8866' # Internal port for backend proxy only
    env_file:
      - ./backend/.env
    networks:
      - tazama_default

  # Bundled model for the investigation copilot (COPILOT_MODE=bundled). llama.cpp (MIT) serving an
  # Apache-2.0 open-weight model; fetch the weights once with docker/copilot/fetch-model.sh.
  copilot-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11459
    container_name: tazama-cms-copilot-llm
    restart: unless-stopped
    # On a GPU host add '-ngl', '99' and pass the GPU through; COPILOT_MODEL_FILE=qwen2.5-1.5b-instruct-q4_k_m.gguf for small machines.
    command: ['-m', '/models/${COPILOT_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}', '--alias', 'qwen3-4b-instruct-2507', '--host', '0.0.0.0', '--port', '8091', '-c', '8192', '--parallel', '1', '--cache-ram', '0', '--jinja']
    volumes:
      - ./docker/copilot/models:/models:ro
    expose:
      - '8091'
    networks:
      - tazama_default

volumes:
  couchdb_data:

networks:
  tazama_default:
    external: true
